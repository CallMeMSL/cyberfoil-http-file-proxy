[package]
name = "cyberfoil-http-file-proxy"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
worker = "=0.8.5"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
